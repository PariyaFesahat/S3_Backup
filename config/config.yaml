server:
  name: "db-server-01"

targets:
  - name: "primary-minio"
    enabled: true
    bucket: "my-postgres-backups"
    region: "us-east-1"
    endpoint_url: "http://localhost:9000"
    access_key_id: "minioadmin"
    secret_access_key: "minioadmin123"
    prefix: "postgres/"

mappings:
  - path: "/opt/test"
    target_name: "primary-minio"
    enabled: true

  - path: "/opt/test2"
    target_name: "primary-minio"
    enabled: true

retention:
  days: 10

logging:
  level: INFO

watcher:
  debounce_seconds: 5
